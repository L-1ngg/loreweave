name: loreweave-pageindex
services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: loreweave
      POSTGRES_PASSWORD: loreweave_local
      POSTGRES_DB: loreweave_pageindex
    ports:
      - "127.0.0.1:45434:5432"
    volumes:
      - pageindex_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loreweave -d loreweave_pageindex"]
      interval: 2s
      timeout: 5s
      retries: 20
volumes:
  pageindex_postgres:
