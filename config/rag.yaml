schema_version: 1

# This file contains behavior only. Keep endpoints and credentials in the
# environment; change profile IDs when intentionally versioning a contract.

indexing_profile:
  id: default-v1
  parser:
    model_version: vlm
    language: ch
    enable_ocr: false
  embedding:
    model: BAAI/bge-m3
    dimensions: 1024
    send_dimensions: false
  chunking:
    max_tokens: 512
    overlap_tokens: 64
  enrichment:
    enabled: true
    model: deepseek-ai/DeepSeek-V4-Flash
    keyword_top_n: 5
    question_top_n: 3
    prompt_version: v1

retrieval_profile:
  id: hybrid-v1
  top_k: 8
  candidate_k: 64
  num_candidates: 128
  score_threshold: 0.2
  term_weight: 0.7
  vector_weight: 0.3
  timezone: Asia/Shanghai
  rerank:
    # Cross-encoder fine ranking over the fused candidate pool. Requires
    # RAG_RERANK_BASE_URL and RAG_RERANK_API_KEY when enabled.
    enabled: false
    model: ""
    top_n: 50
    rrf_k: 60
    # Per-document chunk cap applied to the ranked results; 0 disables folding.
    max_chunks_per_document: 0

generation:
  # Required by `rag answer`, `rag eval run`, and the MCP answer tool.
  model: ""
  temperature: 0.0
  max_tokens: 1200
  prompt_version: v1

evaluation_profile:
  id: ragas-core-v2
  # Required only when `rag eval run --ragas` is used.
  model: ""
