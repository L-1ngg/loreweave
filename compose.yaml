x-rag-app: &rag-app
  image: ${RAG_APP_IMAGE:-my-rag:local}
  build:
    context: .
    args:
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      ALL_PROXY: ${ALL_PROXY:-}
      NO_PROXY: ${NO_PROXY:-}
  env_file:
    - .env
  environment:
    RAG_DATABASE_URL: ${RAG_CONTAINER_DATABASE_URL:-postgresql+asyncpg://rag:rag@postgres:5432/rag}
    RAG_ELASTICSEARCH_URL: http://elasticsearch:9200
    RAG_S3_ENDPOINT_URL: http://minio:9000
    RAG_MCP_BEARER_TOKEN: ${RAG_MCP_BEARER_TOKEN:-}
    RAG_MCP_PUBLIC_BASE_URL: ${RAG_MCP_PUBLIC_BASE_URL:-http://127.0.0.1:${RAG_MCP_PUBLISHED_PORT:-18080}}
  profiles: ["app"]

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rag}
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag}
    ports:
      - "${RAG_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-rag} -d $${POSTGRES_DB:-rag}"]
      interval: 5s
      timeout: 5s
      retries: 20

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_VERSION:-8.19.0}
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "${RAG_ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${RAG_MINIO_PORT:-9000}:9000"
      - "${RAG_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 20

  create-bucket:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - >-
        mc alias set local http://minio:9000
        "$${MINIO_ROOT_USER:-minioadmin}"
        "$${MINIO_ROOT_PASSWORD:-minioadmin}" &&
        mc mb --ignore-existing local/my-rag
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}

  init:
    <<: *rag-app
    command: ["sh", "-c", "rag db upgrade && rag init"]
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: "no"

  mcp:
    <<: *rag-app
    command:
      [
        "rag-mcp",
        "--transport",
        "streamable-http",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
      ]
    depends_on:
      init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${RAG_MCP_PUBLISHED_PORT:-18080}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; socket.create_connection(('127.0.0.1', 8000), 2).close()",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  worker:
    <<: *rag-app
    command: ["rag-worker"]
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres-data:
  elasticsearch-data:
  minio-data:
