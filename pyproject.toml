[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "my-rag"
version = "0.1.0"
description = "An MCP-first RAG service backed by remote MinerU, S3, and Elasticsearch."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16,<2",
  "asyncpg>=0.30,<1",
  "boto3>=1.40,<2",
  "dateparser>=1.2,<2",
  "elasticsearch[async]>=8.17,<9",
  "httpx>=0.28,<1",
  "mcp>=1.28,<2",
  "opencc-python-reimplemented>=0.1.7,<1",
  "pyyaml>=6,<7",
  "sqlalchemy[asyncio]>=2.0.41,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.12,<1",
]
eval = [
  # Ragas 0.4.3 imports vertexai.py, which was removed in 0.4.2.
  "langchain-community>=0.4.1,<0.4.2",
  "openai>=1,<3",
  "ragas>=0.4.3,<0.5",
]

[project.scripts]
rag = "rag_system.interfaces.cli:main"
rag-mcp = "rag_system.interfaces.mcp_server:main"
rag-worker = "rag_system.interfaces.worker:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_system"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
markers = [
  "integration: requires explicitly configured live infrastructure",
]
